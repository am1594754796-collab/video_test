<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人物编号 · 快版（20FPS · 同步排序）</title>
    <link rel="stylesheet" href="/src/app/people-board.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>人物编号 · 快版</h1>
        <p class="sub">
          ~20FPS 相机检测 · Python 同步左→右编号 · 最先举手闪烁
          · <a href="/people.html">原版 people（~10FPS）</a>
          · <a href="/">举手调试</a>
        </p>
      </header>

      <section class="controls">
        <button type="button" id="btn-start">打开相机</button>
        <button type="button" id="btn-stop" disabled>关闭</button>
        <button type="button" id="btn-reset" class="secondary" disabled>下一轮</button>
        <span id="api-status" class="api-status">Python API: 未连接</span>
      </section>

      <section class="hud" aria-live="polite">
        <div class="count-card">
          <div class="count-label">当前人数</div>
          <div id="count-value" class="count-value">0</div>
        </div>
        <div class="winner-card" id="winner-card">
          <div class="count-label">最先举手</div>
          <div id="winner-value" class="winner-value">—</div>
        </div>
        <ol id="number-list" class="number-list"></ol>
      </section>

      <p id="status" class="status" role="status">未启动 · 推荐本页（~20FPS · 同步排序）</p>

      <div class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </main>
    <script type="module" src="/src/app/people-board-fast.ts"></script>
  </body>
</html>
