<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语音作答 · 在线识别</title>
    <link rel="stylesheet" href="/src/app/speech-board.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>语音作答 · 在线识别</h1>
        <p class="sub">
          按下开始后实时转写并边说边匹配；<strong>限时 10s</strong>：通过即停，超时也停
          · <a href="/speech.html">离线 Whisper 版</a>
          · <a href="/people-fast.html">人物编号快版</a>
        </p>
      </header>

      <section class="controls bank-controls">
        <label class="field field-wide">
          答案库相对路径（相对 python/）
          <input
            id="answers-path"
            type="text"
            value="data/answers.json"
            spellcheck="false"
            autocomplete="off"
          />
        </label>
        <button type="button" id="btn-load-bank" class="secondary">加载答案库</button>
        <span id="api-status" class="api-status">检查中…</span>
      </section>

      <section class="controls">
        <label class="field">
          当前题目
          <select id="question-select"></select>
        </label>
        <button type="button" id="btn-speak" class="secondary">扬声器读题</button>
        <button type="button" id="btn-speak-stop" class="secondary">停止朗读</button>
        <button type="button" id="btn-record">按下开始识别</button>
        <span id="countdown" class="api-status">限时 10s</span>
      </section>

      <section id="question-preview" class="question-preview" aria-live="polite">
        <p class="qp-prompt">选题后将显示题干与 A/B/C/D 选项；读题不会念出标准答案。</p>
        <ol class="qp-options" hidden></ol>
      </section>

      <p id="status" class="status" role="status">请选择题目，扬声器读题后开始作答</p>

      <section class="result" aria-live="polite">
        <div class="result-row">
          <span class="label">转写</span>
          <span id="out-transcript">—</span>
        </div>
        <div class="result-row">
          <span class="label">标准答案</span>
          <span id="out-expected">—</span>
        </div>
        <div class="result-row">
          <span class="label">匹配分</span>
          <span id="out-score">—</span>
        </div>
        <div class="result-row">
          <span class="label">结果</span>
          <span id="out-passed" class="pill idle">未测</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/app/speech-board-online.ts"></script>
  </body>
</html>
