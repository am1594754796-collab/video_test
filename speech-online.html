<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>教室抢答 · 视觉、读题与语音作答</title>
    <link rel="stylesheet" href="/src/app/speech-board.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>教室抢答</h1>
        <p class="sub">
          读题 → 抢答 → 麦克风听 A/B/C/D（5 秒一轮，取最后一次）→ 对 +1 / 错 −1 → 自动下一题。
          · <a href="/people-fast.html">视觉调试</a>
          · <a href="/scoreboard.html">计分板</a>
        </p>
      </header>

      <section class="controls bank-controls">
        <label class="field field-wide">
          题库相对路径（相对 python/）
          <input
            id="answers-path"
            type="text"
            value="data/answers.json"
            spellcheck="false"
            autocomplete="off"
          />
        </label>
        <button type="button" id="btn-load-bank" class="secondary">加载题库</button>
        <span id="api-status" class="api-status">检查中…</span>
      </section>

      <section class="controls">
        <label class="field">
          参与人数（1–6）
          <input id="expected-count" type="number" min="1" max="6" value="1" />
        </label>
        <button type="button" id="btn-restart-vision" class="secondary">启动 / 重新编号</button>
      </section>

      <section class="controls">
        <label class="field">
          当前题目
          <select id="question-select"></select>
        </label>
        <label class="field field-rate">
          播放倍速
          <input id="speak-rate" type="range" min="0.5" max="2" step="0.05" value="1" />
          <span id="speak-rate-value">1.00</span>
        </label>
        <button type="button" id="btn-speak" class="secondary">开始本题</button>
        <button type="button" id="btn-speak-stop" class="secondary">停止本轮</button>
      </section>

      <section id="question-preview" class="question-preview" aria-live="polite">
        <p class="qp-prompt">选题后将显示题干与 A/B/C/D 选项；读题不会念出标准答案。</p>
        <ol class="qp-options" hidden></ol>
      </section>

      <div id="raise-countdown" class="raise-countdown" aria-live="assertive" hidden>3</div>

      <section class="race-panel" aria-live="polite">
        <div id="race-banner" class="race-banner" hidden></div>
        <ul id="score-demo" class="score-demo"></ul>
        <p id="detect-status" class="detect-status">后台检测：启动中…</p>
      </section>

      <video id="bg-video" class="bg-video" playsinline muted></video>

      <p id="status" class="status" role="status">等待题库与视觉识别就绪</p>
    </main>
    <script type="module" src="/src/app/speech-board-online.ts"></script>
  </body>
</html>
