<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>计分板</title>
    <link rel="stylesheet" href="/src/app/scoreboard.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <p class="brand">教室计分板</p>
          <h1>仅展示积分</h1>
        </div>
        <p class="sub">
          本页只显示编号与积分。请在独立标签页打开
          <a href="/people-fast.html" target="_blank" rel="noopener">视觉快版</a>
          与
          <a href="/speech-online.html" target="_blank" rel="noopener">语音识别</a>
          ；最先举手会闪烁，语音答对后 +1 并停闪。
        </p>
      </header>

      <section class="controls">
        <button type="button" id="btn-clear-scores" class="secondary">清空积分</button>
        <span id="bus-status" class="api-status">等待视觉页锁定编号…</span>
      </section>

      <p id="status" class="status" role="status">打开视觉页完成人数锁定后，此处会显示大字编号</p>

      <section id="score-board" class="score-board" aria-live="polite"></section>
    </main>
    <script type="module" src="/src/app/scoreboard.ts"></script>
  </body>
</html>
