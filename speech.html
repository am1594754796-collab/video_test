<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语音作答 · 测试</title>
    <link rel="stylesheet" href="/src/app/speech-board.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>语音作答 · 测试</h1>
        <p class="sub">
          外部选题 → 按下开始录音 → 再按结束并识别（离线 Whisper + ≥90% 匹配）
          · <a href="/speech-online.html">在线识别版</a>
          · <a href="/people-fast.html">人物编号快版</a>
          · <a href="/">举手调试</a>
        </p>
      </header>

      <section class="controls bank-controls">
        <label class="field field-wide">
          答案库相对路径（相对 python/）
          <input
            id="answers-path"
            type="text"
            value="data/answers.json"
            spellcheck="false"
            autocomplete="off"
          />
        </label>
        <button type="button" id="btn-load-bank" class="secondary">加载答案库</button>
        <span id="api-status" class="api-status">Python API: 检查中…</span>
      </section>

      <section class="controls">
        <label class="field">
          当前题目
          <select id="question-select"></select>
        </label>
        <button type="button" id="btn-record">按下开始录音</button>
      </section>

      <p id="status" class="status" role="status">请选择题目，按下按钮后开始录音</p>

      <section class="result" aria-live="polite">
        <div class="result-row">
          <span class="label">转写</span>
          <span id="out-transcript">—</span>
        </div>
        <div class="result-row">
          <span class="label">标准答案</span>
          <span id="out-expected">—</span>
        </div>
        <div class="result-row">
          <span class="label">匹配分</span>
          <span id="out-score">—</span>
        </div>
        <div class="result-row">
          <span class="label">结果</span>
          <span id="out-passed" class="pill idle">未测</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/app/speech-board.ts"></script>
  </body>
</html>
