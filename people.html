<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人物数量 · 左到右编号</title>
    <link rel="stylesheet" href="/src/app/people-board.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>人物数量检测</h1>
        <p class="sub">
          独立页面 · MediaPipe 检出人数 · Python 左→右排序编号
          · <a href="/">返回举手调试</a>
        </p>
      </header>

      <section class="controls">
        <button type="button" id="btn-start">打开相机</button>
        <button type="button" id="btn-stop" disabled>关闭</button>
        <span id="api-status" class="api-status">Python API: 未连接</span>
      </section>

      <section class="hud" aria-live="polite">
        <div class="count-card">
          <div class="count-label">当前人数</div>
          <div id="count-value" class="count-value">0</div>
        </div>
        <ol id="number-list" class="number-list"></ol>
      </section>

      <p id="status" class="status" role="status">未启动</p>

      <div class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </main>
    <script type="module" src="/src/app/people-board.ts"></script>
  </body>
</html>
